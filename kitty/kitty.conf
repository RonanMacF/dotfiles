# Theme
include ~/dotfiles/kitty/current-theme.conf

# Fonts
font_family      JetBrainsMono Nerd Font Mono
disable_ligatures cursor
# Use Kitty's built-in Nerd Font for symbols (patched fonts render these broken)
symbol_map U+e000-U+e00a,U+e0a0-U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font

# Cursor
cursor_trail 1
cursor_trail_start_threshold 15

# Scrollback
scrollback_lines 20000
scrollbar always

# Mouse
focus_follows_mouse yes

# Window
confirm_os_window_close -1
window_padding_width 4

# Tab bar
tab_bar_edge top
tab_bar_style powerline

# Bell
enable_audio_bell yes

# macOS
macos_quit_when_last_window_closed yes
macos_option_as_alt yes
macos_titlebar_color background

# Remote control (required for kitty-scrollback.nvim)
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# kitty-scrollback.nvim
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Shortcuts
map opt+cmd+, debug_config
