# ============================================= #
# Start with defaults from the Sensible plugin  #
# --------------------------------------------- #
run-shell /nix/store/7nc5gmpl9jcjprlpdhsfc9zccisgdr26-tmuxplugin-sensible-unstable-2022-08-14/share/tmux-plugins/sensible/sensible.tmux
# ============================================= #

set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1
# We need to set default-shell before calling new-session
set  -g default-shell "/nix/store/fq3hfrj1gfbh9zx6j77mv5qf4sx69s0m-zsh-5.9/bin/zsh"





set -g status-keys vi
set -g mode-keys   vi



# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix




set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     100000

# ============================================= #
# Load plugins with Home Manager                #
# --------------------------------------------- #

# tmuxplugin-sessionist
# ---------------------

run-shell /nix/store/ifvdbyh28dlgsc46nk0052r6i703ccn3-tmuxplugin-sessionist-unstable-2017-12-03/share/tmux-plugins/sessionist/sessionist.tmux


# tmuxplugin-pain-control
# ---------------------

run-shell /nix/store/xy9yrjgppvm8gjp4m5dr00n9rpxpkvrh-tmuxplugin-pain-control-unstable-2020-02-18/share/tmux-plugins/pain-control/pain_control.tmux


# tmuxplugin-vim-tmux-navigator
# ---------------------

run-shell /nix/store/8n64l3npnbam9l7b3ys78z496iv7rkjz-tmuxplugin-vim-tmux-navigator-unstable-2022-08-21/share/tmux-plugins/vim-tmux-navigator/vim-tmux-navigator.tmux


# tmuxplugin-copycat
# ---------------------

run-shell /nix/store/k3fslmarzrk3fizf1xvvr3rrjxdn8ldi-tmuxplugin-copycat-unstable-2020-01-09/share/tmux-plugins/copycat/copycat.tmux


# tmuxplugin-tmux-fzf
# ---------------------

run-shell /nix/store/0i3mlsb7qp53wbs1py0kqkd06971bylh-tmuxplugin-tmux-fzf-unstable-2023-10-24/share/tmux-plugins/tmux-fzf/main.tmux


# tmuxplugin-extrakto
# ---------------------

run-shell /nix/store/1lss904lgx9yjnnb3zch0ik6wgbm54lm-tmuxplugin-extrakto-0-unstable-2024-08-25/share/tmux-plugins/extrakto/extrakto.tmux


# tmuxplugin-power
# ---------------------
set -g @tmux_power_theme 'everforest'

run-shell /nix/store/ppbf65dxx00bbb3lsxvkhb2wcvl65ihy-tmuxplugin-power-unstable-2024-05-12/share/tmux-plugins/power/tmux-power.tmux

# ============================================= #

# Enable activity alerts.
setw -g monitor-activity on
set -g visual-activity on

# sensible bug, https://github.com/tmux/tmux/issues/4162
set -gu default-command
set -g default-shell "$SHELL"
